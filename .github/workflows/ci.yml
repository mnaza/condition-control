# Fast host tests/lint of the pure ac-core crate, and a full xtensa
# firmware build (first run compiles ESP-IDF, later runs hit caches).
# On main pushes the build job also publishes a GitHub release with the
# OTA app image whenever the Cargo.toml version has no tag yet — the
# device's "Update from GitHub" button installs these.
name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    env:
      # Override the workspace's rust-toolchain.toml (channel "esp").
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        working-directory: firmware-stick-rs/ac-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        # Covers the whole firmware workspace (ac-core + the device crate) and
        # the signer; rustfmt needs no target or ESP toolchain.
        working-directory: firmware-stick-rs
        run: |
          cargo fmt --check
          cd ../tools/sign-manifest && cargo fmt --check
      - name: Test
        run: cargo test --target x86_64-unknown-linux-gnu
      - name: Clippy
        # --all-targets so the test files are linted too, not just the lib.
        run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
      - name: Test release signer
        working-directory: tools/sign-manifest
        run: cargo test --target x86_64-unknown-linux-gnu

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          # espup queries the GitHub API for the latest release; without a
          # token shared runners hit the anonymous rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Pinned: left at "latest", espup resolves the version through the
          # GitHub API on every run, and that lookup failed on 2026-08-17 —
          # red main for a day with no code at fault. This is the version
          # green builds were already installing.
          version: 1.95.0.0
          default: true
          buildtargets: esp32
          ldproxy: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware-stick-rs
      - name: Cache ESP-IDF
        uses: actions/cache@v6
        with:
          path: firmware-stick-rs/.embuild
          key: espidf-${{ hashFiles('firmware-stick-rs/Cargo.lock', 'firmware-stick-rs/sdkconfig.defaults') }}
      - name: Build firmware
        working-directory: firmware-stick-rs
        run: cargo build --release
      - name: Clippy (device crate)
        working-directory: firmware-stick-rs
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Install espflash
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # v1.21.0
      - name: Release OTA image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: firmware-stick-rs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          # --force: the rust-cache restore can bring back binstall's manifest
          # without the binary, making a plain binstall a silent no-op.
          cargo binstall -y --force espflash@4.5.0
          command -v espflash
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$V already exists, skipping"
            exit 0
          fi
          espflash save-image --chip esp32 \
            target/xtensa-esp32-espidf/release/firmware-stick-rs condition-control.bin
          # Sign: devices refuse releases without a valid manifest.json.
          rustup toolchain install stable --profile minimal
          RUSTUP_TOOLCHAIN=stable cargo run --release \
            --manifest-path ../tools/sign-manifest/Cargo.toml \
            --target x86_64-unknown-linux-gnu -- \
            sign condition-control.bin "$V" m5stickc-plus2 > manifest.json
          # Pairing gate: the manifest must verify against the public key
          # embedded in the firmware, or the release must not happen.
          PK=$(grep -oE 'hex: [0-9a-f]{64}' src/update.rs | cut -d' ' -f2)
          RUSTUP_TOOLCHAIN=stable cargo run --release \
            --manifest-path ../tools/sign-manifest/Cargo.toml \
            --target x86_64-unknown-linux-gnu -- \
            verify manifest.json "$PK"
          gh release create "v$V" condition-control.bin manifest.json \
            --repo "$GITHUB_REPOSITORY" --title "v$V" \
            --notes "$(git log -1 --pretty=%s)"
